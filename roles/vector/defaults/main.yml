---

# vector configuration file
vector_template: vector.yaml.j2
vector_config_file: /etc/vector/vector.yaml

# vector groups
# vector_groups: []

# install vector from repo
vector_install_from_repo: false
vector_manage_repo: false
vector_repo:
  Debian: deb [signed-by=/usr/share/keyrings/datadog-archive-keyring.gpg] https://apt.vector.dev/ stable vector-0
  RedHat: https://yum.vector.dev/stable/vector-0/$basearch/
vector_repo_key:
  Debian:
    - https://keys.datadoghq.com/DATADOG_APT_KEY_CURRENT.public
    - https://keys.datadoghq.com/DATADOG_APT_KEY_F14F620E.public
    - https://keys.datadoghq.com/DATADOG_APT_KEY_C0962C7D.public
  RedHat:
    - https://keys.datadoghq.com/DATADOG_RPM_KEY_CURRENT.public
    - https://keys.datadoghq.com/DATADOG_RPM_KEY_B01082D3.public
    - https://keys.datadoghq.com/DATADOG_RPM_KEY_FD4BF915.public
vector_repo_gpgcheck: true

# vector package name
vector_package: vector

# Install the Recommends of the downloaded .deb. Ansible's apt module treats a
# deb's Recommends field as a hard install list, so an unresolvable recommend
# fails the task. Vector recommends datadog-signing-keys, which apt.vector.dev
# serves only from its `main` component. A host that enables just `vector-0`
# cannot install it. Set this to false there.
vector_install_recommends: true

# Debian package architecture, keyed by ansible_facts.machine. Only the Debian
# install path reads this. RedHat builds its rpm URL from the machine name.
vector_arch:
  x86_64: amd64
  aarch64: arm64
